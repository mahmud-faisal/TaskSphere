services:
  postgres:
    image: postgres:17-alpine
    container_name: assignment_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assignment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assignment_api
    restart: always
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      JwtSettings__Secret: "${JWT_SECRET:-SuperSecretKeyForAssignmentManagementSystem2026!WithExtraLengthForSecurity}"
      JwtSettings__Issuer: "${JWT_ISSUER:-AssignmentSystemApi}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-AssignmentSystemClient}"
      JwtSettings__ExpiryInMinutes: "${JWT_EXPIRY_MINUTES:-1440}"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}"
    container_name: assignment_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}"
    depends_on:
      - backend

volumes:
  postgres_data:
